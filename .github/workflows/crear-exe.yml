
name: Crear EXE portable de Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Crear EXE
        shell: pwsh
        run: |
          dotnet publish ./GTACodigoOCR.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o ./dist
          if (!(Test-Path './dist/GTACodigoOCR.exe')) { throw 'No se genero el EXE.' }

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: GTACodigoOCR-Windows
          path: dist/GTACodigoOCR.exe
          if-no-files-found: error
